version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait 14 days before proposing an upgrade so we match the
    # `minimumReleaseAge` quarantine in pnpm-workspace.yaml. Without this
    # Dependabot will happily propose a brand-new version that pnpm would
    # then refuse to install (or would silently let through via the
    # already-resolved lockfile, defeating the quarantine).
    cooldown:
      default-days: 14
    groups:
      next-and-react:
        patterns:
          - 'next'
          - 'next-*'
          - 'eslint-config-next'
          - 'react'
          - 'react-*'
          - '@types/react*'
      ai-sdk:
        patterns:
          - 'ai'
          - '@ai-sdk/*'
      tooling:
        patterns:
          - 'typescript'
          - 'eslint*'
          - '@vitejs/*'
          - 'vitest'
          - 'happy-dom'
          - '@playwright/*'
          - '@testing-library/*'
          - 'tsx'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tw-animate-css'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
