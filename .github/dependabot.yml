version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait 14 days before proposing an upgrade so we match the
    # `minimumReleaseAge` quarantine in pnpm-workspace.yaml. Without this
    # Dependabot will happily propose a brand-new version that pnpm would
    # then refuse to install (or would silently let through via the
    # already-resolved lockfile, defeating the quarantine).
    cooldown:
      default-days: 14
    groups:
      next-and-react:
        patterns:
          - 'next'
          - 'next-*'
          - 'eslint-config-next'
          - 'react'
          - 'react-*'
          - '@types/react*'
      ai-sdk:
        patterns:
          - 'ai'
          - '@ai-sdk/*'
      tooling:
        patterns:
          - 'typescript'
          - 'eslint*'
          - '@vitejs/*'
          - 'vitest'
          - 'happy-dom'
          - '@playwright/*'
          - '@testing-library/*'
          - 'tsx'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tw-animate-css'
    # TypeScript majors wait until typescript-eslint supports them. TS 7 broke
    # the whole tooling group (#333: "typescript-eslint does not support TS
    # 7.0"), holding back the patches that ride with it. Drop this once
    # typescript-eslint lists the new major in its supported range.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # ESLint majors wait until eslint-config-next's plugins support them. ESLint
      # 10 broke the tooling group (#354): eslint-plugin-react calls the removed
      # `context.getFilename`. Drop this once eslint-config-next supports 10.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
