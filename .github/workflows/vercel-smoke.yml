name: Vercel deploy smoke

# Why pull_request + push instead of deployment_status:
# GitHub only fires `deployment_status` triggers from the workflow file
# on the DEFAULT branch — so a workflow added in a feature branch can't
# smoke-check its own preview before merging. `pull_request` works on
# any branch; the smoke job polls GitHub's deployments API for Vercel's
# preview URL on the current SHA, then curls it.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: 'Deployment URL to smoke-test (overrides auto-detection)'
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    name: HTTP smoke (no 5xx)
    runs-on: ubuntu-latest
    env:
      # Bypass for Vercel's SSO protection on previews. Generated at
      # Vercel → Project → Settings → Deployment Protection → "Protection
      # Bypass for Automation"; stored as a GitHub repo secret. Without
      # this, smoke would see 401 from every URL.
      VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate config
        run: |
          if [ -z "$VERCEL_BYPASS_TOKEN" ]; then
            echo "::error::VERCEL_BYPASS_TOKEN secret is not set."
            echo "Generate one at Vercel → Project → Settings → Deployment Protection →"
            echo "  'Protection Bypass for Automation', then add it to this repo's secrets as VERCEL_BYPASS_TOKEN."
            echo "See docs/deploying.md §6 for the full setup."
            exit 1
          fi

      - name: Resolve deployment URL
        id: resolve
        run: |
          set -u
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="${{ inputs.url }}"
            echo "Using manual URL: $URL"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Polling Vercel deploy for SHA $SHA..."

          URL=""
          for attempt in $(seq 1 60); do
            # Newest deployment first (GitHub returns descending by created_at).
            DEPLOY_ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&per_page=10" \
              --jq '[.[] | select(.environment == "Preview" or .environment == "Production")] | first.id // empty')

            if [ -n "$DEPLOY_ID" ] && [ "$DEPLOY_ID" != "null" ]; then
              URL=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOY_ID/statuses" \
                --jq '[.[] | select(.state == "success")] | first.environment_url // empty')
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                echo "✓ Resolved after ${attempt}0s: $URL"
                echo "url=$URL" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "  attempt $attempt: no successful Vercel deploy yet, sleeping 10s..."
            sleep 10
          done

          echo "::error::No successful Vercel deployment found for SHA $SHA after 10 minutes."
          echo "Did Vercel skip this build (e.g., paths-ignored, ignored-build-step), or fail the build outright?"
          exit 1

      - name: Smoke key paths
        env:
          DEPLOY_URL: ${{ steps.resolve.outputs.url }}
        run: |
          set -u

          # Paths each preview/production deploy must respond to with non-5xx.
          # 200/3xx (success/redirect), 401 (auth gates), 404 (custom not-found)
          # are all acceptable; 500/502/503/504 are not.
          paths=(
            "/"
            "/en"
            "/de"
            "/en/sake/1"
            "/en/this-path-does-not-exist-on-purpose"
          )

          fail=0
          for path in "${paths[@]}"; do
            url="${DEPLOY_URL%/}$path"
            status=$(curl -sL -o /dev/null -w '%{http_code}' \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_TOKEN}" \
              -H "x-vercel-set-bypass-cookie: true" \
              --max-time 30 \
              "$url" || echo "000")

            if [ "$status" = "000" ]; then
              echo "✘ $url → curl failed (network / timeout)"
              fail=1
            elif [[ "$status" =~ ^5 ]]; then
              echo "✘ $url → HTTP $status (5xx)"
              fail=1
            else
              echo "✓ $url → HTTP $status"
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more URLs returned 5xx. See per-URL lines above."
            exit 1
          fi
          echo "All paths responded with non-5xx."
