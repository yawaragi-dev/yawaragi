name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Per ADR-0009 (data minimisation): we don't share build-time telemetry
  # with Vercel without a DPA. See also `.env.example`.
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Verify (typecheck, lint, unit, audit, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Bypass minimumReleaseAge (pnpm-workspace.yaml) during CI install.
      # The lockfile is the source of truth here — any version that made it
      # into the lockfile already passed the quarantine at resolution time
      # (in local dev or via Dependabot's cooldown). pnpm 11's lockfile audit
      # would otherwise re-check every entry against the policy on every CI
      # run, surfacing 600+ false positives whenever the lockfile contains
      # any package version < 14 days old.
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm i18n:audit

      - name: Register system Chrome with Playwright
        run: pnpm exec playwright install chrome

      - run: pnpm test:e2e
