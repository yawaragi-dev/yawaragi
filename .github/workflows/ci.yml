name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Per ADR-0009 (data minimisation): we don't share build-time telemetry
  # with Vercel without a DPA. See also `.env.example`.
  NEXT_TELEMETRY_DISABLED: 1
  # src/env.ts validates CRON_SECRET (z.string().min(16)) at module load.
  # CI's Playwright webServer otherwise crashes the Next.js dev server on
  # the first request because the env shape fails to parse. This dummy is
  # CI-scoped only; rotation in production is handled via the Vercel env
  # var per slice 10 (#54). The value must be ≥ 16 chars to satisfy the
  # schema.
  CRON_SECRET: ci-only-dummy-32-char-shared-secret
  # Clerk keys — required as .min(1) in src/env.ts since slice 12 (#55).
  # Both values come from the maintainer's Clerk *development* instance
  # (pk_test_ / sk_test_) and live in repo secrets so the workflow yml
  # stays clean of vendor-instance identifiers. Production rotation is
  # handled via the Vercel env var as usual. NEXT_PUBLIC_* is a Next.js
  # client-bundle marker — the publishable key ships to browsers anyway,
  # so the secret storage is a hygiene choice, not a security one.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  # src/env.ts tightened ANTHROPIC_API_KEY to .min(1) in slice S3 (#108).
  # CI's vitest + Playwright dev server otherwise crash at env.parse before
  # the first request. The Playwright webServer overrides
  # VISION_PROVIDER=e2e-stub so no real Anthropic call is made; this dummy
  # only satisfies the env schema. Production / Preview / Development on
  # Vercel carry real `sk-ant-…` values.
  ANTHROPIC_API_KEY: ci-only-dummy-anthropic-key
  # src/env.ts added MCP_SAKENOWA_URL (Phase 4 / S1 #139) as optional, so
  # absence does NOT crash env.parse. We still set a sentinel URL because
  # (a) it documents that the var exists and is intentionally
  # unresolvable in CI (mirrors the CRON_SECRET / ANTHROPIC_API_KEY
  # documentation pattern above), and (b) `.url()` would reject a
  # non-URL string if one ever crept in. `mcp.example.invalid` is under
  # RFC 2606's `.invalid` TLD — it never resolves, which is what we want.
  # The smoke route is bearer-gated, never hit from Playwright, and the
  # registry unit tests stub `@ai-sdk/mcp` at the module boundary so no
  # network call ever happens in CI. Production / Preview on Vercel
  # carry the real deployed MCP URL.
  MCP_SAKENOWA_URL: https://mcp.example.invalid
  # Langfuse OTel-exporter env (Phase 4 / S4 #141). The LangfuseSpanProcessor
  # in src/lib/ai/observability/otel-setup.ts only registers if BOTH the
  # public and secret keys are present, so leaving these unset in CI would
  # silently skip OTel setup. We explicitly leave them undefined — CI's
  # Playwright run executes against the e2e-stub vision provider, which
  # doesn't go through tracedGenerateObject. NODE_ENV !== 'production' in
  # CI, so assertLangfuseConfigured is a no-op (see langfuse-trace.ts).
  # Production / Preview Vercel deploys carry real Langfuse Cloud keys.
  # Listed here so a future contributor sees that the absence is
  # intentional, not an oversight.
  # LANGFUSE_PUBLIC_KEY: (intentionally unset; assertLangfuseConfigured no-ops outside production)
  # LANGFUSE_SECRET_KEY: (intentionally unset)
  # LANGFUSE_HOST: (defaults to https://cloud.langfuse.com inside @langfuse/otel)

jobs:
  verify:
    name: Verify (typecheck, lint, unit, audit, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version is pinned via package.json `packageManager` field for
      # local/CI parity. pnpm 11.2+ added per-command lockfile audits that
      # surface false positives on lockfiles containing recently-published
      # entries; revisit once that's configurable.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Cache Turbopack / Next build artifacts across CI runs. Keyed on the
      # lockfile + source files that participate in the build so PRs that
      # only touch tests or docs get a warm cache. `.next/cache` is the
      # only path Next persists between builds (build output itself is
      # rewritten each run) — see
      # https://nextjs.org/docs/app/guides/ci-build-caching
      - name: Cache Next build (.next/cache)
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      # Production build (Turbopack in Next 16 by default). Positioned
      # after typecheck+lint so obvious errors fail fast, but before the
      # test suites so a Turbopack workStore-invariant / RSC-boundary
      # regression (of the class that slipped through in PR #161) fails
      # CI without eating the ~vitest+integration+playwright budget.
      - run: pnpm build

      # Unit + e2e here EXCLUDE the game tests — game has its own workflow
      # (game-ci.yml) that fires only when game files change. Saves CI
      # minutes on PRs that don't touch the 404 mini-game.
      - run: pnpm exec vitest run --exclude 'src/components/game/**'

      # Integration tests (testcontainers + Postgres). GitHub-hosted runners
      # ship Docker, so `pnpm test:integration` works out of the box. Locals
      # without Docker should run unit tests + rely on CI for integration.
      - run: pnpm test:integration

      - run: pnpm i18n:audit

      - run: pnpm anthropic-files:audit

      - name: Register system Chrome with Playwright
        run: pnpm exec playwright install chrome

      - run: pnpm exec playwright test --grep-invert shibuya
