name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Per ADR-0009 (data minimisation): we don't share build-time telemetry
  # with Vercel without a DPA. See also `.env.example`.
  NEXT_TELEMETRY_DISABLED: 1
  # Bypass minimumReleaseAge (pnpm-workspace.yaml) for ALL pnpm commands
  # in CI. pnpm 11 re-runs the lockfile supply-chain audit on every command
  # (not just install), which would fail any CI run whenever the lockfile
  # contains a package version younger than the quarantine. The lockfile is
  # the source of truth here — versions in it were already vetted at
  # resolution time (in local dev or via Dependabot's cooldown). The
  # quarantine still applies to local resolutions and Dependabot proposals.
  npm_config_minimum_release_age: 0

jobs:
  verify:
    name: Verify (typecheck, lint, unit, audit, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm i18n:audit

      - name: Register system Chrome with Playwright
        run: pnpm exec playwright install chrome

      - run: pnpm test:e2e
