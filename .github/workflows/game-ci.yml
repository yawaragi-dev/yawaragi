name: Game CI

# Only triggers on PRs / main pushes that touch the 404 mini-game.
# The main CI workflow (ci.yml) handles everything else and explicitly
# excludes game tests so they don't run twice.
on:
  pull_request:
    paths:
      - 'src/components/game/**'
      - 'e2e/shibuya-runner.spec.ts'
  push:
    branches: [main]
    paths:
      - 'src/components/game/**'
      - 'e2e/shibuya-runner.spec.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1
  # The same env-schema stand-ins as ci.yml, which explains each one. The
  # Playwright webServer parses src/env.ts on its first request; without
  # these this job has failed to start the server since the schema began
  # requiring them (it last ran, green, in May, before it did).
  CRON_SECRET: ci-only-dummy-32-char-shared-secret
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  ANTHROPIC_API_KEY: ci-only-dummy-anthropic-key
  MCP_SAKENOWA_URL: https://mcp.example.invalid

jobs:
  game:
    name: Game (unit + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run src/components/game

      - name: Register system Chrome with Playwright
        run: pnpm exec playwright install chrome

      - run: pnpm exec playwright test --grep shibuya
