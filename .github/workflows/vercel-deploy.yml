name: Vercel deploy + smoke + e2e

# Manually deploys a branch/SHA to Vercel as a preview, captures the URL,
# then runs the HTTP smoke (no-5xx) and the Playwright E2E suite against
# that URL. Auto-preview is OFF in this Vercel project; this workflow is
# the on-demand path for testing changes end-to-end on real infra.
#
# Optional: pass `url` to skip the deploy step and just run smoke + e2e
# against an already-deployed URL (useful for re-running after a flake or
# debugging a production-only issue).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to deploy (defaults to the workflow trigger ref)'
        type: string
        required: false
      url:
        description: 'Skip the deploy step and run checks against this URL instead'
        type: string
        required: false
      environment:
        description: 'Vercel environment'
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  # Coalesce duplicate manual runs on the same ref + target environment.
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel deploy
    runs-on: ubuntu-latest
    # Skip deploy if the operator handed us an existing URL.
    if: inputs.url == ''
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ENVIRONMENT: ${{ inputs.environment || 'preview' }}
    steps:
      - name: Validate config
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing"
            echo "See docs/deploying.md §6 for how to populate them."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env config
        run: vercel pull --yes --environment="$ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          if [ -z "$URL" ]; then
            echo "::error::Vercel deploy returned an empty URL"
            exit 1
          fi
          echo "Deployed: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  test:
    name: Smoke + E2E
    runs-on: ubuntu-latest
    needs: [deploy]
    # `needs.deploy` is skipped when inputs.url is set; force this job to
    # run anyway by using `always() && !cancelled()` and gating on either
    # output being available.
    if: always() && !cancelled() && (inputs.url != '' || needs.deploy.result == 'success')
    env:
      DEPLOY_URL: ${{ inputs.url || needs.deploy.outputs.url }}
      VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
    steps:
      - name: Validate URL + bypass
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::No deployment URL available (neither inputs.url nor deploy job output set)."
            exit 1
          fi
          if [ -z "$VERCEL_BYPASS_TOKEN" ]; then
            echo "::error::VERCEL_BYPASS_TOKEN secret is not set. See docs/deploying.md §6."
            exit 1
          fi
          echo "Target: $DEPLOY_URL"

      - name: HTTP smoke (no 5xx)
        run: |
          set -u
          paths=(
            "/"
            "/en"
            "/de"
            "/en/sake/1"
            "/en/this-path-does-not-exist-on-purpose"
          )
          fail=0
          for path in "${paths[@]}"; do
            url="${DEPLOY_URL%/}$path"
            jar=$(mktemp)
            status=$(curl -sL -o /dev/null -w '%{http_code}' \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_TOKEN}" \
              -H "x-vercel-set-bypass-cookie: true" \
              --cookie-jar "$jar" --cookie "$jar" \
              --max-time 30 \
              "$url")
            curl_exit=$?
            rm -f "$jar"
            if [ "$curl_exit" -ne 0 ]; then
              echo "✘ $url → curl exit $curl_exit (network / timeout)"
              fail=1
            elif [[ "$status" =~ ^5 ]]; then
              echo "✘ $url → HTTP $status (5xx)"
              fail=1
            else
              echo "✓ $url → HTTP $status"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more URLs returned 5xx or failed."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chrome for Playwright
        run: pnpm exec playwright install chrome

      - name: Playwright (against deployment)
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.DEPLOY_URL }}
          # exclude shibuya/game tests — they have a separate workflow scope
        run: pnpm exec playwright test --grep-invert shibuya
