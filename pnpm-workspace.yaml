# Refuse to install any package version that was published less than 14 days
# ago. Defends against Shai-Hulud-style supply-chain attacks where a
# maintainer account is compromised, a malicious version is published, and
# the community has not yet flagged it. The two-week quarantine gives socket.dev,
# Snyk, GitHub Advisories etc. time to surface the compromise before we pull.
#
# Unit is MINUTES (verified empirically against pnpm 11.3.0's error output;
# pnpm docs say "seconds" but the runtime treats it as minutes). 14 days =
# 14 * 24 * 60 = 20160.
#
# If a CVE forces an urgent newer version, either:
#   (a) set this to 0 temporarily for one install (then revert), or
#   (b) add the package to a `minimumReleaseAgeExclude` list here.
minimumReleaseAge: 20160

# Install-script approval. Each entry must be explicitly true or false; pnpm
# refuses to run install scripts for unapproved packages. Another piece of the
# supply-chain defense (prevents arbitrary code execution on `pnpm install`
# from a freshly compromised dep).
allowBuilds:
  '@clerk/shared': true
  '@parcel/watcher': true
  '@swc/core': true
  # cpu-features / ssh2: testcontainers uses ssh2 to talk to remote Docker daemons
  # over SSH. Local Docker socket works without ssh2's native build (falls back to
  # pure-JS). Setting false to avoid running arbitrary native build scripts.
  cpu-features: false
  esbuild: true
  msw: true
  # protobufjs: install script downloads pre-built native bindings; pure-JS fallback
  # is slower but correct. Transitive of testcontainers. Set false per defense default.
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
